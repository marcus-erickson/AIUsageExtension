<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Usage Dashboard</title>
<link rel="stylesheet" href="styles.css">
<style>
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 24px 60px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 18px; }
  header h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border); }
  .pill.demo { color: var(--warning-text); }
  header .spacer { flex: 1; }
  .banner { padding: 10px 14px; border-radius: 10px; background: var(--surface-1); border: 1px solid var(--border); margin-bottom: 16px; font-size: 13px; }
  .banner.err { color: var(--critical-text); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .card .lbl { color: var(--text-secondary); font-size: 13px; }
  .card .big { font-size: 38px; font-weight: 680; letter-spacing: -0.02em; margin: 2px 0 10px; }
  .card .big small { font-size: 14px; font-weight: 500; color: var(--text-muted); margin-left: 4px; }
  .card .bar { margin-bottom: 12px; }
  .card .detail { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
  .card .reset { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px 12px; min-width: 0; }
  .panel h2 { font-size: 15px; margin: 0 0 2px; }
  .panel .sub { font-size: 13px; color: var(--text-secondary); margin: 0 0 10px; }
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin: 2px 0 6px; }
  .legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--series-1); vertical-align: middle; margin-right: 6px; }
  .legend i.pace { border-top: 2px dashed var(--pace); }
  .legend i.part { width: 10px; height: 10px; border: 0; border-radius: 2px; background: var(--series-1-soft); }
  .legend i.full { width: 10px; height: 10px; border: 0; border-radius: 2px; background: var(--series-1); }
  .tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; z-index: 5; display: none; }
  .tip b { font-size: 13px; }
  .axis text { fill: var(--text-muted); font-size: 11px; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .verdict { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); margin: 6px 0 12px; }
  .verdict .status { font-weight: 600; white-space: nowrap; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 8px; }
  .fact { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; }
  .fact .v { font-size: 20px; font-weight: 650; }
  .fact .k { font-size: 12px; color: var(--text-muted); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  details { margin-top: 12px; }
  details summary { cursor: pointer; color: var(--text-secondary); font-size: 13px; }
  pre { background: var(--surface-2); padding: 12px; border-radius: 8px; font-size: 12px; overflow: auto; max-height: 300px; }
  label.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); margin-left: 6px; }
  .sync { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .sync h3 { font-size: 14px; margin: 0 0 2px; }
  .sync input { flex: 1; min-width: 220px; font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); }
  .empty { text-align: center; padding: 60px 20px; }
  .empty h2 { margin: 0 0 6px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  table.data th, table.data td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } .wrap { padding: 18px 16px 40px; } .facts { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Claude usage</h1>
    <span class="pill" id="plan" hidden></span>
    <span class="pill demo" id="demoPill" hidden>Sample data</span>
    <span class="spacer"></span>
    <span class="muted" id="updated"></span>
    <button id="refresh">Refresh now</button>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<script src="lib/core.js"></script>
<script src="lib/ui.js"></script>
<script src="lib/demo.js"></script>
<script src="lib/charts.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
